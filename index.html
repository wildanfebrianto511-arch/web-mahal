<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Wildan Tech Dashboard</title>

    <style>
        /* 1. Pengaturan dasar */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #f1f5f9;
            background: #0b1120;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. Wadah dashboard */
        .dashboard {
            width: 100%;
            max-width: 720px;
            position: relative; /* untuk posisi popup absolut */
        }

        /* Header layout: judul kiri, jam kanan (stack pada layar kecil) */
        .header { margin-bottom: 20px; }
        .header-top {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }
        @media (max-width: 640px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .clock { align-self: stretch; text-align: right; width: 100%; }
        }

        .label {
            color: #38bdf8;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        h1 {
            margin: 8px 0 6px;
            font-size: clamp(28px, 5vw, 42px);
        }

        .subtitle {
            color: #94a3b8;
            line-height: 1.6;
        }

        /* JAM DIGITAL */
        .clock {
            font-family: "Courier New", Courier, monospace;
            font-weight: 700;
            color: #e6f7ff;
            background: linear-gradient(135deg, rgba(8,47,73,0.85) 0%, rgba(12,95,160,0.9) 100%);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(58,140,255,0.18);
            box-shadow: 0 8px 26px rgba(2,21,50,0.6), 0 0 18px rgba(56,189,248,0.06) inset;
            font-size: clamp(14px, 2.8vw, 18px);
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(56,189,248,0.08);
            min-width: 120px;
            text-align: center;
        }

        /* 3. Kartu penghitung */
        .card {
            padding: 28px;
            background: #151f32;
            border: 1px solid #26364f;
            border-radius: 20px;
            box-shadow: 0 15px 40px #00000030;
        }

        .card-title {
            color: #94a3b8;
            font-size: 14px;
        }

        .counter {
            margin: 18px 0;
            color: #38bdf8;
            font-size: clamp(56px, 12vw, 80px);
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            color: #7dd3fc;
            background: #0c344a;
            border-radius: 20px;
            font-size: 12px;
        }

        /* 4. Tombol (dengan efek glitch petir) */
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 26px;
            position: relative;
        }

        button {
            position: relative;
            flex: 1;
            min-width: 130px;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.12s ease;
            overflow: visible;
            z-index: 1;
            background-clip: padding-box;
        }

        /* Dasar warna tombol */
        .btn-add { color: #082f49; background: #38bdf8; }
        .btn-reset {
            color: #e2e8f0;
            background: #29364b;
            border: 1px solid #475569;
        }

        button:hover { filter: brightness(1.08); transform: translateY(-2px); }
        button:active { transform: scale(0.98); }
        button:focus-visible { outline: 2px solid white; outline-offset: 3px; }

        /* Efek "glitch petir" - layer overlay yang bergerak dan kilat */
        .glitch {
            --accent: rgba(56,189,248,0.95);
        }
        .glitch::before,
        .glitch::after {
            content: "";
            position: absolute;
            left: -6%;
            top: -20%;
            width: 112%;
            height: 140%;
            pointer-events: none;
            border-radius: 12px;
            opacity: 0;
            transform: translate3d(0,0,0);
            mix-blend-mode: screen;
        }

        /* kilatan linear gradient (efek petir) */
        .glitch::before {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 45%, rgba(56,189,248,0.9) 55%, rgba(255,255,255,0) 100%);
            filter: blur(10px);
            animation: lightning 2.8s infinite;
        }

        /* noise/offset layer untuk kesan glitch */
        .glitch::after {
            background: linear-gradient(90deg, rgba(56,189,248,0.06), rgba(8,47,73,0.06));
            filter: blur(4px);
            animation: glitchShift 3.4s infinite;
        }

        @keyframes lightning {
            0% { opacity: 0; transform: translateX(-120%) skewX(-10deg); }
            6% { opacity: 0.9; transform: translateX(-10%) skewX(-6deg); }
            8% { opacity: 0.3; transform: translateX(10%) skewX(6deg); }
            9% { opacity: 1; transform: translateX(-6%) skewX(-3deg); }
            12% { opacity: 0; transform: translateX(120%) skewX(10deg); }
            100% { opacity: 0; transform: translateX(120%) skewX(10deg); }
        }

        @keyframes glitchShift {
            0% { opacity: 0.02; transform: translateX(0) translateY(0) scaleX(1); }
            20% { opacity: 0.06; transform: translateX(-2px) translateY(1px) scaleX(1.01); }
            40% { opacity: 0.02; transform: translateX(1px) translateY(-1px) scaleX(0.99); }
            60% { opacity: 0.08; transform: translateX(-1px) translateY(2px) scaleX(1.02); }
            80% { opacity: 0.03; transform: translateX(0px) translateY(0px) scaleX(1); }
            100% { opacity: 0.02; transform: translateX(0) translateY(0) scaleX(1); }
        }

        /* 5. Popup angka (baru) */
        .number-popup {
            position: absolute;
            background: linear-gradient(180deg, rgba(10,30,50,0.95), rgba(6,16,28,0.95));
            color: #e6f7ff;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(58,140,255,0.18);
            box-shadow: 0 10px 30px rgba(2,10,30,0.6), 0 0 24px rgba(56,189,248,0.06) inset;
            font-weight: 800;
            font-size: 20px;
            transform-origin: center bottom;
            transform: translateY(6px) scale(.8);
            opacity: 0;
            transition: transform 180ms cubic-bezier(.2,.9,.2,1), opacity 140ms ease;
            pointer-events: none;
            z-index: 50;
            white-space: nowrap;
            text-align: center;
        }
        .number-popup.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* 6. Pesan interaktif */
        .message {
            min-height: 48px;
            margin-top: 22px;
            padding: 14px;
            color: #bae6fd;
            background: #0b1729;
            border-radius: 10px;
            line-height: 1.5;
        }

        /* 7. Panel Riwayat Aktivitas (tetap) */
        .activity-panel {
            margin-top: 22px;
            padding: 18px;
            background: linear-gradient(180deg, rgba(11,17,32,0.9), rgba(8,12,22,0.95));
            border: 1px solid #233244;
            border-radius: 14px;
            color: #cbd5e1;
        }

        .activity-panel h2 {
            margin: 0 0 10px;
            font-size: 14px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .activity-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 10px 12px;
            background: linear-gradient(90deg, rgba(20,30,48,0.6), rgba(14,22,36,0.6));
            border-radius: 10px;
            border: 1px solid rgba(60,78,102,0.12);
        }

        .activity-msg {
            color: #e6f7ff;
            font-weight: 600;
            font-size: 13px;
        }

        .activity-time {
            color: #94a3b8;
            font-size: 12px;
            white-space: nowrap;
        }

        .activity-list::-webkit-scrollbar { width: 8px; }
        .activity-list::-webkit-scrollbar-thumb {
            background: rgba(56,189,248,0.12);
            border-radius: 8px;
        }

        .footer {
            margin-top: 20px;
            color: #64748b;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="dashboard">

        <header class="header">
            <div class="header-top">
                <div>
                    <div class="label">MY FIRST TECH PROJECT</div>

                    <h1>Wildan Tech Dashboard</h1>

                    <p class="subtitle">
                        Dashboard interaktif pertamaku.
                        Belajar coding, satu fitur setiap saat.
                    </p>
                </div>

                <!-- Jam digital (tetap ada) -->
                <div id="clock" class="clock" role="status" aria-live="polite" aria-label="Jam digital lokal">
                    00:00:00
                </div>
            </div>
        </header>

        <section class="card" aria-labelledby="card-title">
            <div id="card-title" class="card-title">
                TOTAL TOMBOL DIKLIK
            </div>

            <div class="counter" id="jumlahKlik" aria-live="polite">
                0
            </div>

            <span class="status" id="status">
                ● SIAP DIGUNAKAN
            </span>

            <div class="buttons">
                <button
                    class="glitch btn-add"
                    onclick="tambahKlik(this)">
                    + Tambah Klik
                </button>

                <button
                    class="glitch btn-reset"
                    onclick="resetKlik(this)">
                    Reset
                </button>
            </div>

            <div class="message" id="pesan" role="status">
                Selamat datang! Tekan Tambah Klik untuk memulai.
            </div>
        </section>

        <!-- Panel Riwayat Aktivitas -->
        <section class="activity-panel" aria-labelledby="riwayat-title">
            <h2 id="riwayat-title">Riwayat Aktivitas</h2>

            <ul id="riwayat" class="activity-list" role="log" aria-live="polite" aria-relevant="additions">
                <!-- Item aktivitas akan dirender di sini oleh JavaScript -->
            </ul>
        </section>

        <footer class="footer">
            WILDAN TECH · HTML · CSS · JAVASCRIPT
        </footer>

        <!-- Popup angka (elemen di DOM untuk digunakan ulang) -->
        <div id="numberPopup" class="number-popup" aria-hidden="true"></div>
    </main>

    <script>
        // ---------------------
        // Fitur lama: penghitung klik
        // ---------------------
        let jumlah = 0;

        function perbaruiTampilan() {
            document.getElementById("jumlahKlik").textContent = jumlah;
        }

        // popup management
        let popupTimeout = null;
        const popupEl = document.getElementById("numberPopup");

        function showNumberPopup(value, btnElement) {
            if (!popupEl) return;

            // isi popup
            popupEl.textContent = String(value);

            // posisi relatif ke .dashboard
            const parent = document.querySelector(".dashboard");
            const parentRect = parent.getBoundingClientRect();
            const btnRect = btnElement.getBoundingClientRect();

            // tampilkan dulu agar popup memiliki offsetWidth/Height
            popupEl.classList.add("show");
            popupEl.style.opacity = ""; // let CSS handle
            popupEl.setAttribute("aria-hidden", "false");

            // hitung posisi: di atas tombol, rata tengah
            const popupWidth = popupEl.offsetWidth;
            const popupHeight = popupEl.offsetHeight;

            let left = (btnRect.left - parentRect.left) + (btnRect.width / 2) - (popupWidth / 2);
            let top = (btnRect.top - parentRect.top) - popupHeight - 10;

            // jika melewati sisi kiri/kanan, koreksi
            const padding = 8;
            const maxLeft = parent.clientWidth - popupWidth - padding;
            if (left < padding) left = padding;
            if (left > maxLeft) left = maxLeft;

            // jika tidak cukup ruang di atas, tampilkan di bawah tombol
            if (top < 0) {
                top = (btnRect.top - parentRect.top) + btnRect.height + 10;
            }

            popupEl.style.left = left + "px";
            popupEl.style.top = top + "px";

            // reset animasi jika sudah ada timer
            if (popupTimeout) {
                clearTimeout(popupTimeout);
            }

            // tampilkan selama 900ms lalu sembunyikan
            popupTimeout = setTimeout(() => {
                popupEl.classList.remove("show");
                popupEl.setAttribute("aria-hidden", "true");
                popupTimeout = null;
            }, 900);
        }

        function tambahKlik(btn) {
            // jaga kompatibilitas kalau btn tidak dilewatkan
            if (!btn) btn = document.querySelector(".btn-add");

            jumlah = jumlah + 1;
            perbaruiTampilan();

            document.getElementById("status").textContent = "● AKTIF";

            document.getElementById("pesan").textContent =
                "Mantap! Kamu sudah mengklik tombol sebanyak " +
                jumlah + " kali. Terus belajar! 🚀";

            // Catat ke riwayat aktivitas
            catatAktivitas("Penghitung bertambah menjadi " + jumlah);

            // Tampilkan popup angka (angka saat ini setelah penambahan)
            showNumberPopup(jumlah, btn);
        }

        function resetKlik(btn) {
            if (!btn) btn = document.querySelector(".btn-reset");

            jumlah = 0;
            perbaruiTampilan();

            document.getElementById("status").textContent = "● SIAP DIGUNAKAN";

            document.getElementById("pesan").textContent =
                "Penghitung berhasil direset ke angka nol.";

            // Catat ke riwayat aktivitas
            catatAktivitas("Penghitung di-reset ke 0");

            // Tampilkan popup angka (0)
            showNumberPopup(jumlah, btn);
        }

        // ---------------------
        // Jam digital (tetap)
        // ---------------------
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");
            const clockEl = document.getElementById("clock");
            if (clockEl) clockEl.textContent = `${hours}:${minutes}:${seconds}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ---------------------
        // Riwayat Aktivitas (tetap)
        // ---------------------
        const riwayatAktivitas = []; // setiap item: {msg: string, timestamp: Date}
        const MAX_RIWAYAT = 10;

        function formatTimestamp(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, "0");
            const d = String(date.getDate()).padStart(2, "0");
            const hh = String(date.getHours()).padStart(2, "0");
            const mm = String(date.getMinutes()).padStart(2, "0");
            const ss = String(date.getSeconds()).padStart(2, "0");
            return `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
        }

        function catatAktivitas(pesan) {
            const now = new Date();
            riwayatAktivitas.unshift({ msg: pesan, timestamp: now });
            if (riwayatAktivitas.length > MAX_RIWAYAT) {
                riwayatAktivitas.pop();
            }
            renderRiwayat();
        }

        function renderRiwayat() {
            const container = document.getElementById("riwayat");
            if (!container) return;

            container.innerHTML = "";

            for (const item of riwayatAktivitas) {
                const li = document.createElement("li");
                li.className = "activity-item";

                const msg = document.createElement("div");
                msg.className = "activity-msg";
                msg.textContent = item.msg;

                const time = document.createElement("div");
                time.className = "activity-time";
                time.textContent = formatTimestamp(item.timestamp);

                li.appendChild(msg);
                li.appendChild(time);

                container.appendChild(li);
            }

            if (riwayatAktivitas.length === 0) {
                const li = document.createElement("li");
                li.className = "activity-item";
                li.style.justifyContent = "center";
                li.style.color = "#64748b";
                li.textContent = "Belum ada aktivitas. Gunakan tombol Tambah Klik atau Reset.";
                container.appendChild(li);
            }
        }

        // Inisialisasi awal
        renderRiwayat();
        catatAktivitas("Dashboard dimuat");
    </script>
</body>
</html>
